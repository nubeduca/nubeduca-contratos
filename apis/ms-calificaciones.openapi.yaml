openapi: 3.0.3
info:
  title: nubeduca-ms-calificaciones
  version: 1.0.0
  description: |
    Libro de notas, publicación y auditoría (EVA-02, DAT-01).

    Fuente de verdad de la nota. Crea una columna por cada assignment.published y una nota en DRAFT por cada submission.graded. El alumno solo ve notas POSTED. grade.posted sale también por SNS FIFO (MessageGroupId = tenantId:courseId) para llegar en orden. Todo cambio queda en el historial (DAT-01).

    Convenciones de todo Nubeduca:
    - El tenant sale del claim `custom:tenant_id` del token; nunca va en la ruta ni en el body.
    - `x-roles`: roles (claim `custom:role`) que pueden llamar la operación. Lista vacía = pública.
    - `x-emits`: eventos del catálogo (eventos/catalogo.yaml) que la operación publica si termina bien.
    - `x-task`: tarea del backlog que implementa la operación.
    - Ids en inglés y camelCase; textos para el usuario en español.
servers:
- url: https://{apiId}.execute-api.us-east-1.amazonaws.com/{stage}
  variables:
    apiId:
      default: xxxxxxxxxx
    stage:
      default: dev
      enum:
      - dev
      - staging
      - prod
security:
- cognito: []
tags:
- name: salud
  description: Prueba de vida del servicio.
- name: libro-de-notas
- name: auditoria
paths:
  /health:
    get:
      operationId: calificacionesHealth
      summary: Estado del servicio
      tags:
      - salud
      description: Sin autenticación. GATE-0 y la prueba de humo de REL-01 lo llaman después de cada despliegue.
      responses:
        '200':
          description: El servicio responde.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      x-roles: []
      x-task: LIB-01
      security: []
  /courses/{courseId}/gradebook:
    get:
      operationId: getGradebook
      summary: Libro de notas del curso
      tags:
      - libro-de-notas
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          pattern: ^crs_[0-9A-HJKMNP-TV-Z]{26}$
          example: crs_01JCQRZHQT9F4WY2JYPDV546K7
      responses:
        '200':
          description: Columnas y una fila por alumno matriculado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Gradebook'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - TEACHER
      x-task: EVA-02
  /courses/{courseId}/grades/me:
    get:
      operationId: getMyGrades
      summary: Mis notas publicadas
      tags:
      - libro-de-notas
      parameters:
      - name: courseId
        in: path
        required: true
        schema:
          type: string
          pattern: ^crs_[0-9A-HJKMNP-TV-Z]{26}$
          example: crs_01JCQRZHQT9F4WY2JYPDV546K7
      responses:
        '200':
          description: Solo notas POSTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - STUDENT
      x-task: EVA-02
  /grade-items/{gradeItemId}/post:
    post:
      operationId: postGradeItem
      summary: Publicar las notas de una columna
      tags:
      - libro-de-notas
      description: Emite un grade.posted por alumno, al bus y a SNS FIFO.
      parameters:
      - name: gradeItemId
        in: path
        required: true
        schema:
          type: string
          pattern: ^gri_[0-9A-HJKMNP-TV-Z]{26}$
          example: gri_01JCQRZHQT9F4WY2JYPDV546K7
      responses:
        '200':
          description: Cantidad de notas que pasaron de DRAFT a POSTED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - TEACHER
      x-task: EVA-02
      x-emits:
      - lms.grading.grade.posted.v1
  /grades/{gradeId}:
    patch:
      operationId: overrideGrade
      summary: Ajustar una nota a mano
      tags:
      - libro-de-notas
      description: Siempre emite grade.changed (cause MANUAL_OVERRIDE). Si la nota ya estaba POSTED, emite también
        grade.posted con el valor nuevo.
      parameters:
      - name: gradeId
        in: path
        required: true
        schema:
          type: string
          pattern: ^grd_[0-9A-HJKMNP-TV-Z]{26}$
          example: grd_01JCQRZHQT9F4WY2JYPDV546K7
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeOverride'
      responses:
        '200':
          description: Nota ajustada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grade'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - TEACHER
      x-task: EVA-02
      x-emits:
      - lms.grading.grade.changed.v1
      - lms.grading.grade.posted.v1
  /grades/{gradeId}/history:
    get:
      operationId: getGradeHistory
      summary: Historial de una nota
      tags:
      - auditoria
      parameters:
      - name: gradeId
        in: path
        required: true
        schema:
          type: string
          pattern: ^grd_[0-9A-HJKMNP-TV-Z]{26}$
          example: grd_01JCQRZHQT9F4WY2JYPDV546K7
      responses:
        '200':
          description: Cambios, el más antiguo primero. No se pueden editar ni borrar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GradeHistory'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      x-roles:
      - TEACHER
      - ADMIN
      x-task: DAT-01
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'ID token de Cognito (el access token no trae atributos custom). Claims usados: sub = userId,
        custom:tenant_id, custom:role.'
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    NextToken:
      name: nextToken
      in: query
      required: false
      schema:
        type: string
      description: Token opaco de la página anterior (LastEvaluatedKey de DynamoDB codificado).
  responses:
    BadRequest:
      description: El body o los parámetros no cumplen el contrato.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Falta el token o no es válido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: El rol del token no puede hacer esto, o el recurso es de otro usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: No existe en este tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: El estado actual no permite la operación (por ejemplo, ya está publicado).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
          example: CURSO_NO_ENCONTRADO
          description: Código estable en MAYÚSCULAS para que el frontend decida qué mostrar.
        message:
          type: string
          example: No existe el curso en este tenant.
        requestId:
          type: string
          description: Id de la petición en API Gateway, para buscar en CloudWatch.
      required:
      - code
      - message
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        service:
          type: string
        version:
          type: string
      required:
      - status
      - service
    GradeItem:
      type: object
      properties:
        gradeItemId:
          type: string
          pattern: ^gri_[0-9A-HJKMNP-TV-Z]{26}$
          example: gri_01JCQRZHQT9F4WY2JYPDV546K7
        courseId:
          type: string
          pattern: ^crs_[0-9A-HJKMNP-TV-Z]{26}$
          example: crs_01JCQRZHQT9F4WY2JYPDV546K7
        title:
          type: string
          minLength: 1
          maxLength: 200
        maxScore:
          type: number
        assignmentId:
          type: string
          pattern: ^asg_[0-9A-HJKMNP-TV-Z]{26}$
          example: asg_01JCQRZHQT9F4WY2JYPDV546K7
      required:
      - gradeItemId
      - courseId
      - title
      - maxScore
    Grade:
      type: object
      properties:
        gradeId:
          type: string
          pattern: ^grd_[0-9A-HJKMNP-TV-Z]{26}$
          example: grd_01JCQRZHQT9F4WY2JYPDV546K7
        gradeItemId:
          type: string
          pattern: ^gri_[0-9A-HJKMNP-TV-Z]{26}$
          example: gri_01JCQRZHQT9F4WY2JYPDV546K7
        studentId:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          example: a18577e2-e005-4a49-a29e-755dbf08f5b6
        score:
          type: number
          minimum: 0
        maxScore:
          type: number
        status:
          type: string
          enum:
          - DRAFT
          - POSTED
        postedAt:
          type: string
          format: date-time
          example: '2026-11-10T15:00:00Z'
          nullable: true
      required:
      - gradeId
      - gradeItemId
      - studentId
      - score
      - maxScore
      - status
    GradeList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Grade'
      required:
      - items
    Gradebook:
      type: object
      properties:
        gradeItems:
          type: array
          items:
            $ref: '#/components/schemas/GradeItem'
        rows:
          type: array
          items:
            type: object
            properties:
              studentId:
                type: string
                format: uuid
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
                example: a18577e2-e005-4a49-a29e-755dbf08f5b6
              grades:
                type: array
                items:
                  $ref: '#/components/schemas/Grade'
            required:
            - studentId
            - grades
      required:
      - gradeItems
      - rows
    PostResult:
      type: object
      properties:
        posted:
          type: integer
          minimum: 0
      required:
      - posted
    GradeOverride:
      type: object
      properties:
        score:
          type: number
          minimum: 0
        reason:
          type: string
          minLength: 5
          maxLength: 500
      required:
      - score
      - reason
    GradeHistoryEntry:
      type: object
      properties:
        previousScore:
          type: number
          nullable: true
        score:
          type: number
        cause:
          type: string
          enum:
          - GRADED
          - MANUAL_OVERRIDE
        reason:
          type: string
          nullable: true
        changedBy:
          type: string
          format: uuid
          pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
          example: a18577e2-e005-4a49-a29e-755dbf08f5b6
        changedAt:
          type: string
          format: date-time
          example: '2026-11-10T15:00:00Z'
      required:
      - previousScore
      - score
      - cause
      - changedBy
      - changedAt
    GradeHistory:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/GradeHistoryEntry'
      required:
      - items
