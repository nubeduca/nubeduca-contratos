name: contratos

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/validar_contratos.py
      - name: Compatibilidad de esquemas contra la rama base
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }}
          python scripts/comparar_esquemas.py origin/${{ github.base_ref }}